# SPDX-License-Identifier: Apache-2.0
#
# liblance_engine.so (docs/design.md §2.2): Lance behind a C ABI
# (include/lance_engine.h), loaded by the extension into a backend as it
# first needs it.  Lance is linked from its checkout, mounted read-only at
# /lance in the builder container, at the commit README.md names.
[package]
name = "lance_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lance = { path = "/lance/rust/lance", default-features = false, features = ["aws"] }
lance-core = { path = "/lance/rust/lance-core" }
lance-table = { path = "/lance/rust/lance-table" }
lance-index = { path = "/lance/rust/lance-index" }
lance-linalg = { path = "/lance/rust/lance-linalg" }
lance-select = { path = "/lance/rust/lance-select" }
lance-io = { path = "/lance/rust/lance-io", default-features = false, features = ["aws"] }
lance-file = { path = "/lance/rust/lance-file" }
arrow = { version = "58.0.0", features = ["ffi"] }
arrow-array = "58.0.0"
arrow-buffer = "58.0.0"
arrow-cast = "58.0.0"
arrow-data = "58.0.0"
arrow-schema = "58.0.0"
arrow-select = "58.0.0"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
datafusion = { version = "54.0.0", default-features = false }
futures = "0.3"
half = { version = "2.1", default-features = false, features = ["std"] }
libc = "0.2.176"
object_store = { version = "0.14.2", default-features = false }
roaring = "0.11.4"
serde_json = "1"
tokio = { version = "1.23", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.2", features = ["v4"] }

# Lance's own patch (its Cargo.toml): the object store at the revision Lance
# is built and tested with.
[patch.crates-io]
object_store = { git = "https://github.com/apache/arrow-rs-object-store.git", rev = "c10758c207c0103355f940f0c736fb8ecb157b04" }

# panic = "unwind": every entry point catches a panic and returns it as an
# error (src/ffi.rs), so that it never unwinds into PostgreSQL's frames.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = "debuginfo"
panic = "unwind"
incremental = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"
panic = "unwind"
