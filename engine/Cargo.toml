# SPDX-License-Identifier: Apache-2.0
#
# liblance_engine.so (docs/design.md §2.2): Lance behind a C ABI
# (include/lance_engine.h), loaded by the extension into a backend as it
# first needs it.  Lance's crates come from its repository at the tag below:
# crates.io has no release of 15 yet.
[package]
name = "lance_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lance = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7", default-features = false, features = ["aws"] }
lance-core = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7" }
lance-table = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7" }
lance-index = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7" }
lance-linalg = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7" }
lance-select = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7" }
lance-io = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7", default-features = false, features = ["aws"] }
lance-file = { git = "https://github.com/lance-format/lance.git", tag = "v15.0.0-beta.7" }
arrow = { version = "59.2.0", features = ["ffi"] }
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-cast = "59.2.0"
arrow-data = "59.2.0"
arrow-schema = "59.2.0"
arrow-select = "59.2.0"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
datafusion = { version = "55.0.0", default-features = false }
futures = "0.3"
half = { version = "2.1", default-features = false, features = ["std"] }
libc = "0.2.176"
object_store = { version = "0.14.2", default-features = false }
roaring = "0.11.4"
serde_json = "1"
tokio = { version = "1.23", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.2", features = ["v4"] }

# panic = "unwind": every entry point catches a panic and returns it as an
# error (src/ffi.rs), so that it never unwinds into PostgreSQL's frames.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
strip = "debuginfo"
panic = "unwind"
incremental = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"
panic = "unwind"
